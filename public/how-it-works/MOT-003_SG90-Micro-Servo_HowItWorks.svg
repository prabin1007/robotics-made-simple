" cy="421.24" r="12.299999999999999" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><line x1="1085.8" y1="421.24" x2="1135.0" y2="421.24" stroke="#64748b" stroke-width="6.56"/><path d="M1135.0 421.24 A28.7 28.7 0 0 1 1114.5 452.4" fill="none" stroke="#e11d48" stroke-width="4.1"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Internal feedback detects</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">the shaft position.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Angle is held</text><rect x="1362.9" y="423.7" width="73.8" height="61.49999999999999" rx="4.1" fill="#3b82f6" stroke="#172033" stroke-width="2.46"/><circle cx="1399.8" cy="421.24" r="12.299999999999999" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><line x1="1399.8" y1="421.24" x2="1449.0" y2="421.24" stroke="#64748b" stroke-width="6.56"/><path d="M1449.0 421.24 A28.7 28.7 0 0 1 1428.5 452.4" fill="none" stroke="#e11d48" stroke-width="4.1"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The servo keeps the</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">commanded position.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">MUSCLES → creates movement</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check the exact voltage, pin labels and wiring for</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">the module you buy.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>