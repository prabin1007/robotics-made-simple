<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect width="1600" height="1040" fill="#f8fafc"/><rect width="1600" height="220" fill="#071a3a"/><text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8ec5ff" text-anchor="start">HOW IT WORKS · MOT-003</text><text x="45" y="125" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="white" text-anchor="start">SG90 Micro Servo</text><text x="45" y="171" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#d9e7ff" text-anchor="start">Motors &amp; Motion · simple 5-step explanation</text><rect x="1156.0" y="66.0" width="72.0" height="60.0" rx="4.0" fill="#3b82f6" stroke="#172033" stroke-width="2.4000000000000004"/><circle cx="1192.0" cy="63.6" r="12.0" fill="#e5e7eb" stroke="#172033" stroke-width="2.4000000000000004"/><line x1="1192.0" y1="63.6" x2="1240.0" y2="63.6" stroke="#64748b" stroke-width="6.4"/><path d="M1240.0 63.6 A28.0 28.0 0 0 1 1220.0 94.0" fill="none" stroke="#e11d48" stroke-width="4.0"/><rect x="28" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="66" cy="288" r="23" fill="#145cc6"/><text x="66" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text><text x="52" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Controller sends</text><text x="52" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">pulse</text><rect x="106.9" y="423.7" width="73.8" height="61.49999999999999" rx="4.1" fill="#3b82f6" stroke="#172033" stroke-width="2.46"/><circle cx="143.8" cy="421.24" r="12.299999999999999" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><line x1="143.8" y1="421.24" x2="193.0" y2="421.24" stroke="#64748b" stroke-width="6.56"/><path d="M193.0 421.24 A28.7 28.7 0 0 1 172.5 452.4" fill="none" stroke="#e11d48" stroke-width="4.1"/><text x="50" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A PWM control pulse tells</text><text x="50" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">the target angle.</text><text x="50" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 1 OF 5</text><rect x="342" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="380" cy="288" r="23" fill="#145cc6"/><text x="380" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="366" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Servo reads command</text><rect x="420.9" y="423.7" width="73.8" height="61.49999999999999" rx="4.1" fill="#3b82f6" stroke="#172033" stroke-width="2.46"/><circle cx="457.8" cy="421.24" r="12.299999999999999" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><line x1="457.8" y1="421.24" x2="507.0" y2="421.24" stroke="#64748b" stroke-width="6.56"/><path d="M507.0 421.24 A28.7 28.7 0 0 1 486.5 452.4" fill="none" stroke="#e11d48" stroke-width="4.1"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Internal electronics compare</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">desired and actual position.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" 