idth="2"/><circle cx="66" cy="288" r="23" fill="#145cc6"/><text x="66" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text><text x="52" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Sensor sends sound</text><rect x="78.2" y="415.5" width="122.99999999999999" height="65.6" rx="4.1" fill="#176a9e" stroke="#172033" stroke-width="2.46"/><circle cx="111.0" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="168.39999999999998" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="111.0" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><circle cx="168.39999999999998" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><line x1="123.3" y1="481.1" x2="123.3" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="135.6" y1="481.1" x2="135.6" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="147.89999999999998" y1="481.1" x2="147.89999999999998" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="160.2" y1="481.1" x2="160.2" y2="497.5" stroke="#64748b" stroke-width="3.28"/><path d="M209.4 430.26 Q234.82 448.3 209.4 466.34" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M209.4 418.78 Q240.56 448.3 209.4 477.82" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M209.4 407.3 Q246.29999999999998 448.3 209.4 489.3" fill="none" stroke="#2f80ed" stroke-width="3.28"/><text x="50" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">An ultrasonic pulse is</text><text x="50" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">emitted.</text><text x="50" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 1 OF 5</text><rect x="342" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="380" cy="288" r="23" fill="#145cc6"/><text x="380" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="366" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Sound travels</text><rect x="392.2" y="415.5" width="122.99999999999999" height="65.6" rx="4.1" fill="#176a9e" stroke="#172033" stroke-width="2.46"/><circle cx="425.0" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="482.4" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="425.0" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><circle cx="482.4" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><line x1="437.3" y1="481.1" x2="437.3" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="449.6" y1="481.1" x2="449.6" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="461.9" y1="481.1" x2="461.9" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="474.2" y1="481.1" x2="474.2" y2="497.5" stroke="#64748b" stroke-width="3.28"/><path d="M523.4 430.26 Q548.8199999999999 448.3 523.4 466.34" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M523.4 418.78 Q554.56 448.3 523.4 477.82" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M523.4 407.3 Q560.3 448.3 523.4 489.3" fill="none" stroke="#2f80ed" stroke-width="3.28"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The pulse moves through the</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">air.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Echo returns</text><rect x="706.2" y="415.5" width="122.99999999999999" height="65.6" rx="4.1" fill="#176a9e" stroke="#172033" stroke-width="2.46"/><circle cx="739.0" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="796.4" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="739.0" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><circle cx="796.4" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><line x1="751.3" y1="481.1" x2="751.3" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="763.6" y1="481.1" x2="763.6" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="775.9" y1="481.1" x2="775.9" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="788.2" y1="481.1" x2="788.2" y2="497.5" stroke="#64748b" stroke-width="3.28"/><path d="M837.4 430.26 Q862.8199999999999 448.3 837.4 466.34" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M837.4 418.78 Q868.56 448.3 837.4 477.82" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M837.4 407.3 Q874.3 448.3 837.4 489.3" fill="none" stroke="#2f80ed" stroke-width="3.28"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">It bounces from an object</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">and comes back.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Time is measured</text><rect x="1020.2" y="415.5" width="122.99999999999999" height="65.6" rx="4.1" fill="#176a9e" stroke="#172033" stroke-width="2.46"/><circle cx="1053.0" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="1110.4" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="1053.0" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><circle cx="1110.4" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><line x1="1065.3" y1="481.1" x2="1065.3" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="1077.6" y1="481.1" x2="1077.6" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="1089.9" y1="481.1" x2="1089.9" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="1102.2" y1="481.1" x2="1102.2" y2="497.5" stroke="#64748b" stroke-width="3.28"/><path d="M1151.4 430.26 Q1176.82 448.3 1151.4 466.34" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M1151.4 418.78 Q1182.56 448.3 1151.4 477.82" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M1151.4 407.3 Q1188.3 448.3 1151.4 489.3" fill="none" stroke="#2f80ed" stroke-width="3.28"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The return time tells us the</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">travel distance.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Distance is</text><text x="1308" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">calculated</text><rect x="1334.2" y="415.5" width="122.99999999999999" height="65.6" rx="4.1" fill="#176a9e" stroke="#172033" stroke-width="2.46"/><circle cx="1367.0" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="1424.4" cy="448.3" r="20.5" fill="#dbe6ec" stroke="#172033" stroke-width="2.46"/><circle cx="1367.0" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><circle cx="1424.4" cy="448.3" r="12.299999999999999" fill="#263238" stroke="#172033" stroke-width="2.46"/><line x1="1379.3" y1="481.1" x2="1379.3" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="1391.6" y1="481.1" x2="1391.6" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="1403.9" y1="481.1" x2="1403.9" y2="497.5" stroke="#64748b" stroke-width="3.28"/><line x1="1416.2" y1="481.1" x2="1416.2" y2="497.5" stroke="#64748b" stroke-width="3.28"/><path d="M1465.4 430.26 Q1490.82 448.3 1465.4 466.34" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M1465.4 418.78 Q1496.56 448.3 1465.4 477.82" fill="none" stroke="#2f80ed" stroke-width="3.28"/><path d="M1465.4 407.3 Q1502.3 448.3 1465.4 489.3" fill="none" stroke="#2f80ed" stroke-width="3.28"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Arduino converts that time</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">into centimetres.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">SENSES → notices the world</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check the exact voltage, pin labels and wiring for</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">the module you buy.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>