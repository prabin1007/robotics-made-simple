"437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><line x1="539.8" y1="452.4" x2="564.4" y2="452.4" stroke="#e11d48" stroke-width="4.1"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The circuit receives a</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">voltage difference.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Current can flow</text><rect x="726.7" y="423.7" width="106.6" height="57.4" rx="4.1" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><rect x="833.3" y="442.56" width="11.479999999999999" height="19.68" rx="4.1" fill="#94a3b8" stroke="#172033" stroke-width="2.46"/><rect x="743.1" y="437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><rect x="769.34" y="437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><rect x="795.58" y="437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><line x1="853.8" y1="452.4" x2="878.4" y2="452.4" stroke="#e11d48" stroke-width="4.1"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A closed path allows</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">electrical current.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Parts receive power</text><rect x="1040.7" y="423.7" width="106.6" height="57.4" rx="4.1" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><rect x="1147.3" y="442.56" width="11.479999999999999" height="19.68" rx="4.1" fill="#94a3b8" stroke="#172033" stroke-width="2.46"/><rect x="1057.1" y="437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><rect x="1083.34" y="437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><rect x="1109.58" y="437.64" width="18.04" height="29.52" rx="1.64" fill="#5bbf4a" stroke="#2a8a37" stroke-width="1.64"/><line x1="1167.8" y1="452.4" x2="1192.4" y2="452.4" stroke="#e11d48" stroke-width="4.1"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Controllers and modules get</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">usable energy.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288"