0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Output receives it</text><circle cx="771.8" cy="444.2" r="24.599999999999998" fill="#facc15" stroke="#172033" stroke-width="2.46"/><line x1="763.6" y1="468.8" x2="763.6" y2="505.7" stroke="#172033" stroke-width="2.46"/><line x1="780.0" y1="468.8" x2="780.0" y2="505.7" stroke="#172033" stroke-width="2.46"/><line x1="808.7" y1="425.75" x2="841.5" y2="399.1" stroke="#f59e0b" stroke-width="3.28"/><line x1="808.7" y1="440.1" x2="841.5" y2="427.8" stroke="#f59e0b" stroke-width="3.28"/><line x1="808.7" y1="454.45" x2="841.5" y2="456.5" stroke="#f59e0b" stroke-width="3.28"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">0.96 OLED I2C responds to</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">the command.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Energy changes form</text><circle cx="1085.8" cy="444.2" r="24.599999999999998" fill="#facc15" stroke="#172033" stroke-width="2.46"/><line x1="1077.6" y1="468.8" x2="1077.6" y2="505.7" stroke="#172033" stroke-width="2.46"/><line x1="1094.0" y1="468.8" x2="1094.0" y2="505.7" stroke="#172033" stroke-width="2.46"/><line x1="1122.7" y1="425.75" x2="1155.5" y2="399.1" stroke="#f59e0b" stroke-width="3.28"/><line x1="1122.7" y1="440.1" x2="1155.5" y2="427.8" stroke="#f59e0b" stroke-width="3.28"/><line x1="1122.7" y1="454.45" x2="1155.5" y2="456.5" stroke="#f59e0b" stroke-width="3.28"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Electrical energy becomes</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">light, sound or switching.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">You see the result</text><circle cx="1399.8" cy="444.2" r="24.599999999999998" fill="#facc15" stroke="#172033" stroke-width="2.46"/><line x1="1391.6" y1="468.8" x2="1391.6" y2="505.7" stroke="#172033" stroke-width="2.46"/><line x1="1408.0" y1="468.8" x2="1408.0" y2="505.7" stroke="#172033" stroke-width="2.46"/><line x1="1436.7" y1="425.75" x2="1469.5" y2="399.1" stroke="#f59e0b" stroke-width="3.28"/><line x1="1436.7" y1="440.1" x2="1469.5" y2="427.8" stroke="#f59e0b" stroke-width="3.28"/><line x1="1436.7" y1="454.45" x2="1469.5" y2="456.5" stroke="#f59e0b" stroke-width="3.28"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The project gives</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">visible/audible action.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">RESPONSE → shows or does something</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">LED polarity matters; use a current-limiting</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">resistor.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>