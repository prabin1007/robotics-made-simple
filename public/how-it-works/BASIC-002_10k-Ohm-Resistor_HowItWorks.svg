rt">current</text><line x1="82.3" y1="454.04" x2="111.0" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="111.0" y="437.64" width="86.1" height="32.8" rx="4.1" fill="#e9c46a" stroke="#172033" stroke-width="2.46"/><line x1="197.1" y1="454.04" x2="238.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="129.04" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#8b4513" stroke="#8b4513" stroke-width="0.82"/><rect x="145.44" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#111827" stroke="#111827" stroke-width="0.82"/><rect x="161.83999999999997" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#e11d48" stroke="#e11d48" stroke-width="0.82"/><rect x="178.24" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#d4af37" stroke="#d4af37" stroke-width="0.82"/><text x="50" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Electrical current wants to</text><text x="50" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">flow.</text><text x="50" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 1 OF 5</text><rect x="342" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="380" cy="288" r="23" fill="#145cc6"/><text x="380" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="366" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Resistor slows it</text><line x1="396.3" y1="454.04" x2="425.0" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="425.0" y="437.64" width="86.1" height="32.8" rx="4.1" fill="#e9c46a" stroke="#172033" stroke-width="2.46"/><line x1="511.1" y1="454.04" x2="552.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="443.04" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#8b4513" stroke="#8b4513" stroke-width="0.82"/><rect x="459.44" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#111827" stroke="#111827" stroke-width="0.82"/><rect x="475.84" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#e11d48" stroke="#e11d48" stroke-width="0.82"/><rect x="492.24" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#d4af37" stroke="#d4af37" stroke-width="0.82"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Resistance limits how much</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">current flows.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Energy becomes heat</text><line x1="710.3" y1="454.04" x2="739.0" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="739.0" y="437.64" width="86.1" height="32.8" rx="4.1" fill="#e9c46a" stroke="#172033" stroke-width="2.46"/><line x1="825.1" y1="454.04" x2="866.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="757.04" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#8b4513" stroke="#8b4513" stroke-width="0.82"/><rect x="773.44" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#111827" stroke="#111827" stroke-width="0.82"/><rect x="789.84" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#e11d48" stroke="#e11d48" stroke-width="0.82"/><rect x="806.24" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#d4af37" stroke="#d4af37" stroke-width="0.82"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A tiny amount of energy is</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">dissipated.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Safe current</text><text x="994" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">continues</text><line x1="1024.3" y1="454.04" x2="1053.0" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="1053.0" y="437.64" width="86.1" height="32.8" rx="4.1" fill="#e9c46a" stroke="#172033" stroke-width="2.46"/><line x1="1139.1" y1="454.04" x2="1180.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="1071.04" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#8b4513" stroke="#8b4513" stroke-width="0.82"/><rect x="1087.44" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#111827" stroke="#111827" stroke-width="0.82"/><rect x="1103.84" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#e11d48" stroke="#e11d48" stroke-width="0.82"/><rect x="1120.24" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#d4af37" stroke="#d4af37" stroke-width="0.82"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The next component receives</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">a safer current.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">LED stays protected</text><line x1="1338.3" y1="454.04" x2="1367.0" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="1367.0" y="437.64" width="86.1" height="32.8" rx="4.1" fill="#e9c46a" stroke="#172033" stroke-width="2.46"/><line x1="1453.1" y1="454.04" x2="1494.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="1385.04" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#8b4513" stroke="#8b4513" stroke-width="0.82"/><rect x="1401.44" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#111827" stroke="#111827" stroke-width="0.82"/><rect x="1417.84" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#e11d48" stroke="#e11d48" stroke-width="0.82"/><rect x="1434.24" y="437.64" width="6.56" height="32.8" rx="0.0" fill="#d4af37" stroke="#d4af37" stroke-width="0.82"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Common use: protect an LED</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">from excess current.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">CIRCUIT HELPER → shapes/protects electrical behavior</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check the exact voltage, pin labels and wiring for</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">the module you buy.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>