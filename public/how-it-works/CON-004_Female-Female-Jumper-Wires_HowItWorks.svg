" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">PATHWAYS → carries power and signals</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check the exact voltage, pin labels and wiring for</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">the module you buy.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>