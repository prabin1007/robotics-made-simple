ed" stroke-width="3.28"/><path d="M180.7 409.76 Q215.14 454.04 180.7 498.32" fill="none" stroke="#7c3aed" stroke-width="3.28"/><text x="50" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The program chooses an</text><text x="50" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">output.</text><text x="50" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 1 OF 5</text><rect x="342" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="380" cy="288" r="23" fill="#145cc6"/><text x="380" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="366" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Signal is sent</text><circle cx="449.6" cy="454.04" r="34.44" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="449.6" cy="454.04" r="8.2" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><path d="M494.7 436.0 Q516.02 454.04 494.7 472.08" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M494.7 422.88 Q522.5799999999999 454.04 494.7 485.2" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M494.7 409.76 Q529.14 454.04 494.7 498.32" fill="none" stroke="#7c3aed" stroke-width="3.28"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A pin changes state or sends</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">data.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Output receives it</text><circle cx="763.6" cy="454.04" r="34.44" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="763.6" cy="454.04" r="8.2" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><path d="M808.7 436.0 Q830.02 454.04 808.7 472.08" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M808.7 422.88 Q836.5799999999999 454.04 808.7 485.2" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M808.7 409.76 Q843.14 454.04 808.7 498.32" fill="none" stroke="#7c3aed" stroke-width="3.28"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Active Buzzer responds to</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">the command.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Energy changes form</text><circle cx="1077.6" cy="454.04" r="34.44" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="1077.6" cy="454.04" r="8.2" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><path d="M1122.7 436.0 Q1144.02 454.04 1122.7 472.08" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M1122.7 422.88 Q1150.58 454.04 1122.7 485.2" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M1122.7 409.76 Q1157.1399999999999 454.04 1122.7 498.32" fill="none" stroke="#7c3aed" stroke-width="3.28"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Electrical energy becomes</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">light, sound or switching.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">You see the result</text><circle cx="1391.6" cy="454.04" r="34.44" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="1391.6" cy="454.04" r="8.2" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><path d="M1436.7 436.0 Q1458.02 454.04 1436.7 472.08" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M1436.7 422.88 Q1464.58 454.04 1436.7 485.2" fill="none" stroke="#7c3aed" stroke-width="3.28"/><path d="M1436.7 409.76 Q1471.1399999999999 454.04 1436.7 498.32" fill="none" stroke="#7c3aed" stroke-width="3.28"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The project gives</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">visible/audible action.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">RESPONSE → shows or does something</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check the exact voltage, pin labels and wiring for</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">the module you buy.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>