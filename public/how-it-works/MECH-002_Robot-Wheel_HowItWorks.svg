<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect width="1600" height="1040" fill="#f8fafc"/><rect width="1600" height="220" fill="#071a3a"/><text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8ec5ff" text-anchor="start">HOW IT WORKS · MECH-002</text><text x="45" y="125" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="white" text-anchor="start">Robot Wheel</text><text x="45" y="171" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#d9e7ff" text-anchor="start">Mechanical · simple 5-step explanation</text><circle cx="1196.0" cy="95.6" r="44.0" fill="#202124" stroke="#172033" stroke-width="2.4000000000000004"/><circle cx="1196.0" cy="95.6" r="24.0" fill="#64748b" stroke="#172033" stroke-width="2.4000000000000004"/><circle cx="1196.0" cy="95.6" r="8.0" fill="#e5e7eb" stroke="#172033" stroke-width="2.4000000000000004"/><rect x="28" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="66" cy="288" r="23" fill="#145cc6"/><text x="66" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text><text x="52" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">A part needs support</text><circle cx="147.89999999999998" cy="454.04" r="45.099999999999994" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="147.89999999999998" cy="454.04" r="24.599999999999998" fill="#64748b" stroke="#172033" stroke-width="2.46"/><circle cx="147.89999999999998" cy="454.04" r="8.2" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><text x="50" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Electronics and moving parts</text><text x="50" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">need structure.</text><text x="50" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 1 OF 5</text><rect x="342" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="380" cy="288" r="23" fill="#145cc6"/><text x="380" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="366" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Hardware holds it</text><circle cx="461.9" cy="454.04" r="45.099999999999994" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="461.9" cy="454.04" r="24.599999999999998" fill="#64748b" stroke="#172033" stroke-width="2.46"/><circle cx="461.9" cy="454.04" r="8.2" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Robot Wheel supports or</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">transfers force.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Alignment is</text><text x="680" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">maintained</text><circle cx="775.9" cy="454.04" r="45.099999999999994" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="775.9" cy="454.04" r="24.599999999999998" fill="#64748b" stroke="#172033" stroke-width="2.46"/><circle cx="775.9" cy="454.04" r="8.2" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Parts stay in the intended</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">position.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Movement transfers</text><circle cx="1089.9" cy="454.04" r="45.099999999999994" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="1089.9" cy="454.04" r="24.599999999999998" fill="#64748b" stroke="#172033" stroke-width="2.46"/><circle cx="1089.9" cy="454.04" r="8.2" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Forces reach wheels or</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">mechanisms.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Robot stays</text><text x="1308" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">functional</text><circle cx="1403.9" cy="454.04" r="45.099999999999994" fill="#202124" stroke="#172033" stroke-width="2.46"/><circle cx="1403.9" cy="454.04" r="24.599999999999998" fill="#64748b" stroke="#172033" stroke-width="2.46"/><circle cx="1403.9" cy="454.04" r="8.2" fill="#e5e7eb" stroke="#172033" stroke-width="2.46"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The structure keeps the</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">build usable.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">BODY → supports and transfers movement</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check the exact voltage, pin labels and wiring for</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">the module you buy.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>