#172033" stroke-width="2.46"/><line x1="211.85999999999999" y1="454.04" x2="246.29999999999998" y2="454.04" stroke="#64748b" stroke-width="6.56"/><path d="M238.1 427.8 A26.24 26.24 0 1 1 238.1 481.1" fill="none" stroke="#2f80ed" stroke-width="4.1"/><text x="50" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Electrical energy reaches</text><text x="50" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">the motor.</text><text x="50" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 1 OF 5</text><rect x="342" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="380" cy="288" r="23" fill="#145cc6"/><text x="380" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="366" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Magnetic fields form</text><rect x="420.9" y="431.9" width="77.89999999999999" height="45.099999999999994" rx="4.1" fill="#f0b323" stroke="#172033" stroke-width="2.46"/><circle cx="502.9" cy="454.04" r="22.959999999999997" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><circle cx="502.9" cy="454.04" r="8.2" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="525.86" y1="454.04" x2="560.3" y2="454.04" stroke="#64748b" stroke-width="6.56"/><path d="M552.1 427.8 A26.24 26.24 0 1 1 552.1 481.1" fill="none" stroke="#2f80ed" stroke-width="4.1"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Current through coils</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">creates magnetic force.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Rotor moves</text><rect x="734.9" y="431.9" width="77.89999999999999" height="45.099999999999994" rx="4.1" fill="#f0b323" stroke="#172033" stroke-width="2.46"/><circle cx="816.9" cy="454.04" r="22.959999999999997" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><circle cx="816.9" cy="454.04" r="8.2" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="839.86" y1="454.04" x2="874.3" y2="454.04" stroke="#64748b" stroke-width="6.56"/><path d="M866.1 427.8 A26.24 26.24 0 1 1 866.1 481.1" fill="none" stroke="#2f80ed" stroke-width="4.1"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Magnetic</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">attraction/repulsion turns</text><text x="678" y="643" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">the rotor.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Gears/shaft move</text><rect x="1048.9" y="431.9" width="77.89999999999999" height="45.099999999999994" rx="4.1" fill="#f0b323" stroke="#172033" stroke-width="2.46"/><circle cx="1130.9" cy="454.04" r="22.959999999999997" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><circle cx="1130.9" cy="454.04" r="8.2" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="1153.86" y1="454.04" x2="1188.3" y2="454.04" stroke="#64748b" stroke-width="6.56"/><path d="M1180.1 427.8 A26.24 26.24 0 1 1 1180.1 481.1" fill="none" stroke="#2f80ed" stroke-width="4.1"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Motion is transferred to the</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">output shaft.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Robot moves</text><rect x="1362.9" y="431.9" width="77.89999999999999" height="45.099999999999994" rx="4.1" fill="#f0b323" stroke="#172033" stroke-width="2.46"/><circle cx="1444.9" cy="454.04" r="22.959999999999997" fill="#d9dee5" stroke="#172033" stroke-width="2.46"/><circle cx="1444.9" cy="454.04" r="8.2" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="1467.86" y1="454.04" x2="1502.3" y2="454.04" stroke="#64748b" stroke-width="6.56"/><path d="M1494.1 427.8 A26.24 26.24 0 1 1 1494.1 481.1" fill="none" stroke="#2f80ed" stroke-width="4.1"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Wheels or mechanisms use the</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">rotation.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">MUSCLES → creates movement</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Do not power a motor directly from a microcontroller</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">GPIO pin.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component ex