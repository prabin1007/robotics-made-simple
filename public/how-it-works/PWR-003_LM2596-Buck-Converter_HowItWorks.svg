.0" y1="456.5" x2="404.5" y2="456.5" stroke="#e11d48" stroke-width="4.1"/><line x1="523.4" y1="456.5" x2="556.2" y2="456.5" stroke="#16a34a" stroke-width="4.1"/><text x="379" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">12V IN</text><text x="559" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">5V OUT</text><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The circuit receives a</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">voltage difference.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Current can flow</text><rect x="718.5" y="419.6" width="118.89999999999999" height="73.8" rx="4.1" fill="#285fa6" stroke="#172033" stroke-width="2.46"/><circle cx="748.84" cy="456.5" r="16.4" fill="#64748b" stroke="#172033" stroke-width="2.46"/><rect x="778.36" y="436.0" width="36.9" height="36.9" rx="4.1" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="698.0" y1="456.5" x2="718.5" y2="456.5" stroke="#e11d48" stroke-width="4.1"/><line x1="837.4" y1="456.5" x2="870.2" y2="456.5" stroke="#16a34a" stroke-width="4.1"/><text x="693" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">12V IN</text><text x="873" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">5V OUT</text><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A closed path allows</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">electrical current.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Parts receive power</text><rect x="1032.5" y="419.6" width="118.89999999999999" height="73.8" rx="4.1" fill="#285fa6" stroke="#172033" stroke-width="2.46"/><circle cx="1062.84" cy="456.5" r="16.4" fill="#64748b" stroke="#172033" stroke-width="2.46"/><rect x="1092.36" y="436.0" width="36.9" height="36.9" rx="4.1" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="1012.0" y1="456.5" x2="1032.5" y2="456.5" stroke="#e11d48" stroke-width="4.1"/><line x1="1151.4" y1="456.5" x2="1184.2" y2="456.5" stroke="#16a34a" stroke-width="4.1"/><text x="1007" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">12V IN</text><text x="1187" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">5V OUT</text><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Controllers and modules get</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">usable energy.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Project runs</text><rect x="1346.5" y="419.6" width="118.89999999999999" height="73.8" rx="4.1" fill="#285fa6" stroke="#172033" stroke-width="2.46"/><circle cx="1376.84" cy="456.5" r="16.4" fill="#64748b" stroke="#172033" stroke-width="2.46"/><rect x="1406.36" y="436.0" width="36.9" height="36.9" rx="4.1" fill="#202124" stroke="#172033" stroke-width="2.46"/><line x1="1326.0" y1="456.5" x2="1346.5" y2="456.5" stroke="#e11d48" stroke-width="4.1"/><line x1="1465.4" y1="456.5" x2="1498.2" y2="456.5" stroke="#16a34a" stroke-width="4.1"/><text x="1321" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">12V IN</text><text x="1501" y="420" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">5V OUT</text><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The robot can sense, think</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">and act.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">ENERGY → powers the robot</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Check polarity and voltage before connecting your</text><text x="842" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">circuit.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>