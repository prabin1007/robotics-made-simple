oke-width="4.1"/><line x1="420.9" y1="493.4" x2="519.3" y2="493.4" stroke="#16a34a" stroke-width="4.1"/><polygon points="519.3,493.4 502.9,483.56 502.9,503.24" fill="#16a34a" stroke="#16a34a" stroke-width="0.82"/><text x="364" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Its junction allows current</text><text x="364" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">mainly one way.</text><text x="364" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 2 OF 5</text><rect x="656" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="694" cy="288" r="23" fill="#145cc6"/><text x="694" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="680" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Forward direction</text><line x1="710.3" y1="454.04" x2="743.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="743.1" y="440.92" width="73.8" height="26.24" rx="6.56" fill="#202124" stroke="#202124" stroke-width="1.64"/><rect x="792.3" y="440.92" width="8.2" height="26.24" rx="0.0" fill="#d1d5db" stroke="#d1d5db" stroke-width="0.82"/><line x1="816.9" y1="454.04" x2="866.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><line x1="734.9" y1="493.4" x2="833.3" y2="493.4" stroke="#16a34a" stroke-width="4.1"/><polygon points="833.3,493.4 816.9,483.56 816.9,503.24" fill="#16a34a" stroke="#16a34a" stroke-width="0.82"/><text x="678" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Current passes when polarity</text><text x="678" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">is correct.</text><text x="678" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 3 OF 5</text><rect x="970" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1008" cy="288" r="23" fill="#145cc6"/><text x="1008" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="994" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Reverse direction</text><line x1="1024.3" y1="454.04" x2="1057.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="1057.1" y="440.92" width="73.8" height="26.24" rx="6.56" fill="#202124" stroke="#202124" stroke-width="1.64"/><rect x="1106.3" y="440.92" width="8.2" height="26.24" rx="0.0" fill="#d1d5db" stroke="#d1d5db" stroke-width="0.82"/><line x1="1130.9" y1="454.04" x2="1180.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><line x1="1048.9" y1="493.4" x2="1147.3" y2="493.4" stroke="#16a34a" stroke-width="4.1"/><polygon points="1147.3,493.4 1130.9,483.56 1130.9,503.24" fill="#16a34a" stroke="#16a34a" stroke-width="0.82"/><text x="992" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Current is blocked in the</text><text x="992" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">opposite direction.</text><text x="992" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 4 OF 5</text><rect x="1284" y="250" width="300" height="470" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><circle cx="1322" cy="288" r="23" fill="#145cc6"/><text x="1322" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="1308" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Circuit is protected</text><line x1="1338.3" y1="454.04" x2="1371.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><rect x="1371.1" y="440.92" width="73.8" height="26.24" rx="6.56" fill="#202124" stroke="#202124" stroke-width="1.64"/><rect x="1420.3" y="440.92" width="8.2" height="26.24" rx="0.0" fill="#d1d5db" stroke="#d1d5db" stroke-width="0.82"/><line x1="1444.9" y1="454.04" x2="1494.1" y2="454.04" stroke="#64748b" stroke-width="4.1"/><line x1="1362.9" y1="493.4" x2="1461.3" y2="493.4" stroke="#16a34a" stroke-width="4.1"/><polygon points="1461.3,493.4 1444.9,483.56 1444.9,503.24" fill="#16a34a" stroke="#16a34a" stroke-width="0.82"/><text x="1306" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Useful for polarity</text><text x="1306" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">protection and motor/relay</text><text x="1306" y="643" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">kickback.</text><text x="1306" y="690" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start">STEP 5 OF 5</text><rect x="28" y="755" width="760" height="220" rx="20" fill="white" stroke="#d7e0eb" stroke-width="2"/><text x="58" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#145cc6" text-anchor="start">REMEMBER</text><text x="58" y="857" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">CIRCUIT HELPER → shapes/protects electrical behavior</text><text x="58" y="910" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Robotics chain: SENSE → THINK → POWER → MOVE → RESPOND</text><rect x="812" y="755" width="760" height="220" rx="20" fill="#fffaf0" stroke="#ecd69a" stroke-width="2"/><text x="842" y="805" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#a35b00" text-anchor="start">WATCH OUT</text><text x="842" y="858" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172033" text-anchor="start">The stripe marks the cathode. Direction matters.</text><text x="28" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Robotics, Made Simple · component explainer</text></svg>